name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Standard für alle Jobs: nur lesen. Schreibrechte bekommt allein der Release-Job.
permissions:
  contents: read

jobs:
  # Läuft auf jedem Branch und für Pull Requests – ohne Zugriff auf den Signaturschlüssel.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the version number is derived from the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Read version
        id: version
        run: echo "name=$(./gradlew --no-daemon -q printVersionName)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WakeUp-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk

  # Every push to main gets its own version (commit count), so publish it as a
  # signed release. Only this job sees the signing secrets.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub release and its tag.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Without the key the build would silently fall back to the debug key; stop instead.
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 fehlt – kein Release ohne Release-Schlüssel."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Read version
        id: version
        run: echo "name=$(./gradlew --no-daemon -q printVersionName)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WakeUp-${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "v$VERSION" app/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" \
            --title "WakeUp $VERSION" \
            --generate-notes
