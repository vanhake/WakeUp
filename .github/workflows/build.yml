name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub release and its tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version number is derived from the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Secrets are not available for pull requests from forks; the release
      # build then falls back to the debug key (see app/build.gradle.kts).
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Read version
        id: version
        run: echo "name=$(./gradlew --no-daemon -q printVersionName)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: WakeUp-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WakeUp-${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/*.apk

      # Every push to main gets its own version (commit count), so publish it
      # as a release. Only with the private key, never with the debug fallback.
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "v$VERSION" app/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" \
            --title "WakeUp $VERSION" \
            --generate-notes
